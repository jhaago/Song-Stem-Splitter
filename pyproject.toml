[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "song-stem-splitter"
version = "0.1.0a1"
description = "Local desktop application for AI-assisted music stem separation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Song Stem Splitter contributors" }]
dependencies = [
  "platformdirs>=4.2,<5",
  "certifi>=2025.1.31",
]

[project.optional-dependencies]
app = [
  "PySide6>=6.8,<7",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "sounddevice>=0.5,<1",
  "mutagen>=1.47,<2",
  "imageio-ffmpeg>=0.5,<1",
  "demucs>=4.1,<4.2",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "pyinstaller>=6.10,<7",
]

[project.scripts]
stem-separator = "song_stem_splitter.app:main"
stem-separator-engine = "song_stem_splitter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
