plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jhaago.vocalreducer'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.jhaago.vocalreducer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha1'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', '-DCMAKE_BUILD_TYPE=Release'
                cppFlags '-std=c++17'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            debuggable true
            jniDebuggable false
        }
        release {
            minifyEnabled false
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += ['/META-INF/AL2.0', '/META-INF/LGPL2.1']
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        abortOnError true
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
}
