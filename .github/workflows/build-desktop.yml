name: Build desktop bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-desktop.yml'
      - 'song_stem_splitter.spec'

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            machine: x86_64
            label: Intel
          - runner: macos-15
            machine: arm64
            label: Apple-Silicon
    runs-on: ${{ matrix.runner }}
    env:
      # The current physical test Mac runs Ventura 13.x, so keep the bundle target compatible.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify runner architecture
        shell: bash
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "${{ matrix.machine }}"

      - run: python -m pip install --upgrade pip

      - name: Install compatible NumPy baseline
        run: python -m pip install 'numpy>=1.26,<2'

      # Demucs 4.1 pulls sphn. Intel macOS currently has no suitable prebuilt
      # sphn wheel, so pip builds it from source. sphn's audiopus_sys dependency
      # otherwise falls back to an old bundled Opus CMake project that newer
      # build environments reject. Install a native Intel Opus library and
      # expose it through pkg-config so audiopus_sys links to it instead.
      - name: Prepare Intel native audio toolchain
        if: matrix.machine == 'x86_64'
        shell: bash
        run: |
          brew install opus pkg-config
          OPUS_PREFIX="$(brew --prefix opus)"
          echo "PKG_CONFIG_PATH=${OPUS_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="${OPUS_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          pkg-config --modversion opus
          pkg-config --libs opus

      - run: pip install -e '.[app,dev]'

      - name: Show runtime versions
        shell: bash
        run: |
          python -c "import platform, torch; print('Python architecture:', platform.machine()); print('PyTorch:', torch.__version__)"

      - name: Build macOS app
        run: pyinstaller --clean song_stem_splitter.spec

      - name: Verify built executable architecture
        shell: bash
        run: |
          APP_EXE="dist/Song Stem Splitter.app/Contents/MacOS/Song Stem Splitter"
          test -x "$APP_EXE"
          INFO="$(file "$APP_EXE")"
          echo "$INFO"
          echo "$INFO" | grep -q "${{ matrix.machine }}"

      - name: Ad-hoc sign test app
        shell: bash
        run: |
          codesign --force --deep --sign - "dist/Song Stem Splitter.app"
          codesign --verify --deep --strict "dist/Song Stem Splitter.app"

      - name: Create DMG
        shell: bash
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R "dist/Song Stem Splitter.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "Song Stem Splitter" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "dist/Song-Stem-Splitter-macOS-${{ matrix.label }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: song-stem-splitter-macOS-${{ matrix.label }}
          path: dist/Song-Stem-Splitter-macOS-${{ matrix.label }}.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[app,dev]'
      - run: pyinstaller --clean song_stem_splitter.spec
      - uses: actions/upload-artifact@v4
        with:
          name: song-stem-splitter-Windows
          path: dist/
